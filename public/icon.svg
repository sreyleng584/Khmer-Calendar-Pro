<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="50%" stop-color="#8b1e1e" />
      <stop offset="100%" stop-color="#5a0f0f" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded card with warm gold border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Calendar Page Header Spine / Rings -->
  <path d="M 160,110 L 352,110" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  <circle cx="200" cy="110" r="8" fill="#fdfbf7" />
  <circle cx="312" cy="110" r="8" fill="#fdfbf7" />

  <!-- Stylized Crescent Moon (Lunar Chankitek) in background -->
  <path d="M 360,140 A 110,110 0 1 0 420,320 A 95,95 0 1 1 360,140 Z" fill="url(#gold)" opacity="0.3" />

  <!-- Simplified Angkor Wat Three-Tower Silhouette on Gold Base -->
  <g fill="url(#gold)" filter="url(#shadow)">
    <!-- Central Tower Spire -->
    <path d="M 256,150 L 268,220 L 282,226 L 270,240 L 274,310 L 238,310 L 242,240 L 230,226 L 244,220 Z" />
    <!-- Left Tower -->
    <path d="M 200,190 C 208,210 216,245 216,310 L 192,310 C 192,245 200,210 200,190 Z" opacity="0.9" />
    <!-- Right Tower -->
    <path d="M 312,190 C 320,210 328,245 328,310 L 304,310 C 304,245 312,210 312,190 Z" opacity="0.9" />
    <!-- Sanctuary Base Wall -->
    <rect x="168" y="310" width="176" height="22" rx="4" />
    <!-- Grand Staircase / Outer Moat Base -->
    <path d="M 140,336 L 372,336 L 392,364 L 120,364 Z" opacity="0.85" />
    <rect x="100" y="364" width="312" height="16" rx="6" />
  </g>

  <!-- Golden Sun / Full Moon Emblem in Center -->
  <circle cx="256" cy="190" r="18" fill="#fdfbf7" opacity="0.9" filter="url(#shadow)" />
</svg>
