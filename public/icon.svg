<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich Deep Burgundy & Royal Maroon Gradient Background -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#8B0000" />
      <stop offset="60%" stop-color="#5A0B0B" />
      <stop offset="100%" stop-color="#3D0808" />
    </radialGradient>
    
    <!-- Luminous Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE6A0" />
      <stop offset="25%" stop-color="#FFD700" />
      <stop offset="60%" stop-color="#C99227" />
      <stop offset="90%" stop-color="#996515" />
      <stop offset="100%" stop-color="#FFE6A0" />
    </linearGradient>

    <!-- Subtle Gold Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE6A0" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#8A5A00" />
    </linearGradient>

    <!-- Deep Soft Shadow for Relief Effect -->
    <filter id="royalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    
    <!-- Glow Effect -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Gold Decorative Border -->
  <rect x="20" y="20" width="472" height="472" rx="94" fill="none" stroke="url(#rimGrad)" stroke-width="6" filter="url(#royalShadow)" />
  <rect x="32" y="32" width="448" height="448" rx="82" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Traditional Angkorian Floral Corners -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <!-- Top-Left Corner Motif -->
    <path d="M 45,45 Q 65,45 75,60 Q 60,65 45,45 Z M 55,55 Q 75,70 70,90 Q 60,75 55,55 Z" />
    <!-- Top-Right Corner Motif -->
    <path d="M 467,45 Q 447,45 437,60 Q 452,65 467,45 Z M 457,55 Q 437,70 442,90 Q 452,75 457,55 Z" />
    <!-- Bottom-Left Corner Motif -->
    <path d="M 45,467 Q 65,467 75,452 Q 60,447 45,467 Z M 55,457 Q 75,442 70,422 Q 60,437 55,457 Z" />
    <!-- Bottom-Right Corner Motif -->
    <path d="M 467,467 Q 447,467 437,452 Q 452,447 467,467 Z M 457,457 Q 437,442 442,422 Q 452,437 457,457 Z" />
  </g>

  <!-- Side Bas-Relief Devata Silhouettes -->
  <g fill="#7A0D0D" opacity="0.6">
    <!-- Left Devata -->
    <path d="M 68,160 Q 85,170 80,210 Q 75,230 85,260 Q 90,280 82,310 Q 70,350 78,380 L 58,380 Q 52,340 62,300 Q 68,260 62,230 Q 55,200 68,160 Z" />
    <!-- Right Devata -->
    <path d="M 444,160 Q 427,170 432,210 Q 437,230 427,260 Q 422,280 430,310 Q 442,350 434,380 L 454,380 Q 460,340 450,300 Q 444,260 450,230 Q 457,200 444,160 Z" />
  </g>

  <!-- Calendar Page Motif Container (Background behind Royal Bust) -->
  <g filter="url(#royalShadow)">
    <!-- Calendar Backing Card -->
    <rect x="136" y="116" width="240" height="290" rx="28" fill="#5A0B0B" stroke="url(#goldGrad)" stroke-width="5" />
    
    <!-- Calendar Header Spine Rings -->
    <rect x="180" y="104" width="24" height="24" rx="6" fill="url(#goldGrad)" />
    <rect x="308" y="104" width="24" height="24" rx="6" fill="url(#goldGrad)" />

    <!-- Sun and Crescent Moon (Chankitek Timekeeping Symbols) -->
    <!-- Sun (Left) -->
    <g transform="translate(168, 160)">
      <circle cx="0" cy="0" r="14" fill="url(#goldGrad)" />
      <circle cx="0" cy="0" r="10" fill="#FFF8E7" />
      <path d="M 0,-18 L 0,-22 M 0,18 L 0,22 M -18,0 L -22,0 M 18,0 L 22,0 M -12,-12 L -15,-15 M 12,12 L 15,15 M -12,12 L -15,15 M 12,-12 L 15,-15" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Crescent Moon (Right) -->
    <g transform="translate(344, 160)">
      <path d="M 10,-14 A 14,14 0 1 1 -10,14 A 18,18 0 1 0 10,-14 Z" fill="url(#goldGrad)" />
    </g>

    <!-- Mini Calendar Grid Dots/Cells -->
    <!-- Left Grid Column -->
    <rect x="160" y="210" width="24" height="18" rx="4" fill="url(#goldGrad)" opacity="0.8" />
    <rect x="160" y="238" width="24" height="18" rx="4" fill="url(#goldGrad)" opacity="0.8" />
    <rect x="160" y="266" width="24" height="18" rx="4" fill="url(#goldGrad)" opacity="0.8" />

    <!-- Right Grid Column -->
    <rect x="328" y="210" width="24" height="18" rx="4" fill="url(#goldGrad)" opacity="0.8" />
    <rect x="328" y="238" width="24" height="18" rx="4" fill="url(#goldGrad)" opacity="0.8" />
    <rect x="328" y="266" width="24" height="18" rx="4" fill="url(#goldGrad)" opacity="0.8" />
  </g>

  <!-- Dignified Angkorian Royal Sculpture (King Jayavarman VII inspired bust) -->
  <g filter="url(#royalShadow)">
    <!-- Ornate Crown / Jata Mukuta (Spire) -->
    <path d="M 256,70 
             L 272,95 L 290,110 L 282,130 L 298,145 L 286,165 L 302,185 L 276,195
             L 276,210 L 236,210 L 236,195
             L 210,185 L 226,165 L 214,145 L 230,130 L 222,110 L 240,95 Z" 
          fill="url(#goldGrad)" stroke="#FFF8E7" stroke-width="1.5" />
    
    <!-- Crown Jewels & Detailed Frontal Rosette -->
    <circle cx="256" cy="135" r="10" fill="#FFF8E7" />
    <circle cx="256" cy="135" r="5" fill="#8B0000" />
    <path d="M 240,165 Q 256,175 272,165 Q 265,185 256,190 Q 247,185 240,165 Z" fill="#FFF8E7" opacity="0.9" />

    <!-- Royal Face & Serene Expression -->
    <!-- Head/Jaw Structure -->
    <path d="M 226,190 C 220,210 216,240 220,270 C 224,300 240,325 256,330 C 272,325 288,300 292,270 C 296,240 292,210 286,190 Z" fill="url(#goldGrad)" />
    
    <!-- Cheekbones and Soft Contours -->
    <path d="M 232,225 C 232,255 280,255 280,225 C 280,210 232,210 232,225 Z" fill="url(#goldGrad)" opacity="0.7" />

    <!-- Serene Almond Eyes & Eyebrows -->
    <path d="M 234,222 Q 244,216 252,222 Q 244,226 234,222 Z" fill="#3D0808" />
    <path d="M 260,222 Q 268,216 278,222 Q 268,226 260,222 Z" fill="#3D0808" />
    <circle cx="244" cy="222" r="2.5" fill="#FFF8E7" />
    <circle cx="268" cy="222" r="2.5" fill="#FFF8E7" />

    <!-- Regal Nose -->
    <path d="M 252,224 L 250,256 Q 256,262 262,256 L 260,224" fill="none" stroke="#663300" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Gentle Archaic Smile -->
    <path d="M 240,275 Q 256,285 272,275 Q 256,293 240,275 Z" fill="#5A0B0B" />
    <path d="M 242,276 Q 256,284 270,276" fill="none" stroke="url(#goldGrad)" stroke-width="2" />

    <!-- Ornate Kundala Earrings (Traditional Khmer Ear Pendants) -->
    <!-- Left Earring -->
    <path d="M 216,230 C 205,230 200,245 208,265 C 215,280 224,285 220,295 C 216,305 204,300 204,290" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <circle cx="208" cy="285" r="7" fill="#FFF8E7" />

    <!-- Right Earring -->
    <path d="M 296,230 C 307,230 312,245 304,265 C 297,280 288,285 292,295 C 296,305 308,300 308,290" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <circle cx="304" cy="285" r="7" fill="#FFF8E7" />

    <!-- Elaborate Collar / Necklace (Samrap Phka and Jewels) -->
    <path d="M 210,325 Q 256,345 302,325 L 316,350 Q 256,380 196,350 Z" fill="url(#goldGrad)" stroke="#FFF8E7" stroke-width="1.5" />
    <!-- Center Necklace Pendant / Lotus Jewel -->
    <path d="M 246,345 L 256,370 L 266,345 Z" fill="#FFF8E7" />
    <circle cx="256" cy="355" r="4" fill="#8B0000" />
    <circle cx="226" cy="336" r="4" fill="#FFF8E7" />
    <circle cx="286" cy="336" r="4" fill="#FFF8E7" />
  </g>

  <!-- Bottom Traditional Khmer Base Lotus Ornamentation -->
  <g fill="url(#goldGrad)" filter="url(#royalShadow)">
    <path d="M 216,420 Q 256,395 296,420 Q 276,435 256,425 Q 236,435 216,420 Z" />
    <path d="M 236,424 Q 256,410 276,424 Q 266,432 256,427 Q 246,432 236,424 Z" fill="#FFF8E7" />
  </g>
</svg>
